<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="shortcut icon" href="images/192x.png" type="image/x-icon">
    <title>Plan My Grind</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body onload="load()">
    <div id="header">
        <h1 id="title"></h1>
    </div>

    <div id="Home" class="mainview">
        0.4.7.h
    </div>
    <div id="Goals" class="mainview">
    </div>
    <div id="People" class="mainview">
        <a href="#NewPerson"><button class="plusButton">+</button></a>
        <div id="peopleDisplay"></div>
    </div>
    <div id="Planner" class="mainview">
        <nav class="datepicker">
            <div id="p1"></div>
            <div id="p2"></div>
            <div id="p3"></div>
            <div id="p4"></div>
            <div id="p5"></div>
            <div id="p6"></div>
            <div id="p7"></div>
        </nav>
        <div id="dayDisplay"></div>
        <button class="secondButton" onclick="syncGoogleCalendar()">⟳</button>
        <a href="#NewEvent"><button class="plusButton">+</button></a>
    </div>
    <div id="Tasks" class="mainview">
        <a href="#NewTask"><button class="plusButton">+</button></a>
        <button class="secondButton" onclick="bumpTasks()">⬆</button>
        <div id="taskDisplay"></div>
    </div>

    <div id="nav">
        <a href="#Goals">
            Goals
        </a>
        <a href="#People">
            People
        </a>
        <a href="#Home">
            Home
        </a>
        <a href="#Planner" onclick="plannerNav()">
            Planner
        </a>
        <a href="#Tasks">
            Tasks
        </a>
    </div>
    <div id="blanket" onclick="navBack()"></div>
    <div class="popup" id="Settings">
        <h1>Settings</h1>
        <hr><br>
        <h2>Planner</h2>
        <br>
        <h3>Sync With Google Calendar:</h3>
        <h3 id="google-wrapper"><button onclick="googleSignIn()" id="google-signin">Sign In With Google</button></h3>
    </div>
    <div class="popup" id="NewPerson">
        <h1>Add Contact</h1>
        <p>Name: <input type="text" id="contactName"></p>
        <p>Phone Number: <input type="text" id="contactTel"></p>
        <p>Email Address: <input type="text" id="contactEmail"></p>
        <button onclick="newPerson()">Create Contact</button>
        <button id="contactsUploadBtn" onclick="uploadContacts()">Upload Contacts From Your Device</button>
    </div>
    <div class="popup" id="NewTask">
        <h1>Add Task</h1>
        <p>Title:<br><input type="text" id="taskTitle"></p>
        <p>Description:<br><textarea type="text" id="taskBody"></textarea></p>
        <button onclick="newTask()">Create Task</button>
    </div>
    <div class="popup" id="NewEvent">
        <h1>Add Event</h1>
        <p>Title:<br><input type="text" id="eventTitle"></p>
        <p>Description:<br><textarea type="text" id="eventBody"></textarea></p>
        <p>Date: <input type="date" name="date" id="date"></p>
        <p>Start Time: <input type="time" name="startTime" id="startTime"></p>
        <p>End Time: <input type="time" name="endTime" id="endTime"></p>
        <button onclick="newEvent()">Create Event</button>
    </div>
    <div id="syncWindow"><h1>Syncing...</h1></div>
    <script src="script.js"></script>
</body>
</html>
